[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catpred-accelerated"
version = "0.1.0"
description = "Explicit reversible adapters for the pinned CatPred inference path"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["catpred_accel*"]

[tool.setuptools.package-data]
catpred_accel = ["profiles/*.json", "accepted_sources.json", "validation/*.json", "THIRD_PARTY_NOTICES.md"]
